    }catch(e){

        console.warn(

        );

}

/* =========================
   VIDEO PREPARATION
========================= */

function createRenderVideo(file){

    return new Promise((resolve,reject)=>{

        const video = document.createElement("video");

        video.src =
        URL.createObjectURL(file);

        video.muted = true;

        video.playsInline = true;

        video.preload = "auto";


        video.onloadedmetadata = ()=>{

            videoDuration =
            video.duration;

            resolve(video);

        };


        video.onerror = ()=>{

            reject(
                new Error(
                    "Video loading failed"
                )
            );

        };


    });

}



/* =========================
   CANVAS SETUP
========================= */

function setupCanvas(video){

    canvas =
    document.createElement("canvas");


    let width =
    video.videoWidth;


    let height =
    video.videoHeight;


    if(wideMode.checked){

        width =
        Math.max(

            width,

            Math.floor(
                height * 16 / 9
            )

        );

    }


    canvas.width = width;

    canvas.height = height;


    ctx =
    canvas.getContext(
        "2d",
        {
            alpha:false
        }
    );


}



/* =========================
   START PROCESSING
========================= */


generateBtn.addEventListener(
    "click",
    startProcessing
);



async function startProcessing(){

    if(processing)
        return;


    if(!selectedFile){

        showToast(
            "یک ویدیو انتخاب کنید"
        );

        return;

    }


    processing = true;


    generateBtn.disabled = true;


    progressSection.style.display =
    "block";


    output.style.display =
    "none";


    percent.textContent =
    "0%";


    progressFill.style.width =
    "0%";


    chunks = [];


    try{


        sourceVideo =
        await createRenderVideo(
            selectedFile
        );


        setupCanvas(
            sourceVideo
        );


        await sourceVideo.play();


        startRecording();


    }


    catch(error){


        console.error(error);


        showToast(
            "خطا در شروع پردازش"
        );


        finishCleanup();


    }


}



/* =========================
   MEDIA RECORDER SETUP
========================= */


function startRecording(){


    stream =
    canvas.captureStream(
        fps
    );


    let options = {

        videoBitsPerSecond:
        4000000

    };


    if(
        MediaRecorder
        .isTypeSupported(
        "video/webm;codecs=vp9"
        )
    ){

        options.mimeType =
        "video/webm;codecs=vp9";

    }

    else if(
        MediaRecorder
        .isTypeSupported(
        "video/webm;codecs=vp8"
        )
    ){

        options.mimeType =
        "video/webm;codecs=vp8";

    }



    recorder =
    new MediaRecorder(
        stream,
        options
    );



    recorder.ondataavailable =
    event=>{


        if(
            event.data &&
            event.data.size > 0
        ){

            chunks.push(
                event.data
            );

        }


    };



    recorder.onstop =
    createOutput;



    recorder.start(
        100
    );



    startTime =
    performance.now();



    renderVideo();

}



/* =========================
   VIDEO FRAME LOOP
========================= */


function renderVideo(){


    if(
        !sourceVideo ||
        sourceVideo.ended
    ){

        stopRecording();

        return;

    }



    drawFrame();



    updateProgress();



    if(
        sourceVideo.requestVideoFrameCallback
    ){

        sourceVideo
        .requestVideoFrameCallback(
            renderVideo
        );

    }

    else{

        animationId =
        requestAnimationFrame(
            renderVideo
        );

    }


}



/* =========================
   DRAW CURRENT FRAME
========================= */


function drawFrame(){


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );



    if(wideMode.checked){


        const scale =
        Math.max(

            canvas.width /
            sourceVideo.videoWidth,


            canvas.height /
            sourceVideo.videoHeight

        );


        const w =
        sourceVideo.videoWidth *
        scale;


        const h =
        sourceVideo.videoHeight *
        scale;


        const x =
        (canvas.width-w)/2;


        const y =
        (canvas.height-h)/2;



        ctx.drawImage(

            sourceVideo,

            x,

            y,

            w,

            h

        );


    }

    else{


        ctx.drawImage(

            sourceVideo,

            0,

            0,

            canvas.width,

            canvas.height

        );


    }



}

/* =========================
   TEXT DRAWING
========================= */

function drawText(){


    const text =
    mainText.value.trim();


    if(!text)
        return;



    const lines =
    text.split("\n");



    const size =
    Number(fontSize.value);



    ctx.save();



    ctx.font =
    "700 "
    + size +
    "px "
    + fontSelect.value;



    ctx.textAlign =
    "center";



    ctx.textBaseline =
    "middle";



    ctx.fillStyle =
    textColor.value;



    ctx.strokeStyle =
    strokeColor.value;



    ctx.lineWidth =
    Math.max(
        4,
        size / 8
    );



    if(shadowToggle.checked){

        ctx.shadowBlur =
        12;

        ctx.shadowColor =
        "rgba(0,0,0,0.8)";

    }



    let y;



    if(currentPosition==="top"){

        y =
        canvas.height * 0.15;

    }

    else if(currentPosition==="center"){

        y =
        canvas.height * 0.5;

    }

    else{

        y =
        canvas.height * 0.85;

    }



    const gap =
    size * 1.25;



    const start =
    y -
    ((lines.length-1)*gap)/2;



    lines.forEach((line,index)=>{


        const lineY =
        start +
        index*gap;



        ctx.strokeText(

            line,

            canvas.width/2,

            lineY

        );



        ctx.fillText(

            line,

            canvas.width/2,

            lineY

        );


    });



    ctx.restore();


}


/* =========================
   WATERMARK
========================= */
function drawWatermark(){

    ctx.save();

    ctx.globalAlpha = 0.4;

    ctx.translate(
        25,
        canvas.height / 2
    );

    ctx.rotate(
        -Math.PI / 2
    );

    ctx.font =
    "700 24px Arial";

    ctx.textAlign =
    "center";

    ctx.fillStyle =
    "#ffffff";

    ctx.strokeStyle =
    "rgba(0,0,0,0.8)";

    ctx.lineWidth = 4;


    ctx.strokeText(
        "@verified_GIF",
        0,
        0
    );


    ctx.fillText(
        "@verified_GIF",
        0,
        0
    );


    ctx.restore();

}
/* =========================
   UPDATE FRAME
========================= */

function drawFrame(){


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );



    if(wideMode.checked){


        const scale =
        Math.max(

            canvas.width /
            sourceVideo.videoWidth,


            canvas.height /
            sourceVideo.videoHeight

        );



        const width =
        sourceVideo.videoWidth *
        scale;



        const height =
        sourceVideo.videoHeight *
        scale;



        const x =
        (canvas.width-width)/2;



        const y =
        (canvas.height-height)/2;



        ctx.drawImage(

            sourceVideo,

            x,

            y,

            width,

            height

        );


    }

    else{


        ctx.drawImage(

            sourceVideo,

            0,

            0,

            canvas.width,

            canvas.height

        );


    }



    drawText();



    drawWatermark();


}



/* =========================
   PROGRESS
========================= */

function updateProgress(){


    if(
        !sourceVideo ||
        !sourceVideo.duration
    )
        return;



    const value =

    (

        sourceVideo.currentTime /

        sourceVideo.duration

    ) * 100;



    const fixed =

    Math.min(

        100,

        Math.floor(value)

    );



    progressFill.style.width =

    fixed + "%";



    percent.textContent =

    fixed + "%";


}



/* =========================
   STOP RECORDING
========================= */

function stopRecording(){


    if(animationId){

        cancelAnimationFrame(
            animationId
        );

        animationId=null;

    }



    if(
        recorder &&
        recorder.state !== "inactive"
    ){

        recorder.stop();

    }



    if(stream){

        stream
        .getTracks()
        .forEach(track=>{

            track.stop();

        });

    }



}


/* =========================
   SAFETY STOP
========================= */

setInterval(()=>{


    if(
        processing &&
        sourceVideo &&
        sourceVideo.ended
    ){

        stopRecording();

    }


},500);

/* =========================
   FINISH RECORDING
========================= */

async function createOutput(){

    const rawBlob = new Blob(
        chunks,
        {
            type: "video/webm"
        }
    );

    // MediaRecorder WebM files often contain no Duration metadata.
    // They can play correctly but appear as 0 seconds in gallery/file apps.
    // Use the real source duration and write it into the WebM metadata.
    let fixedBlob = rawBlob;

    try{
        const durationMs =
            Math.max(
                1,
                Math.round(
                    Number(videoDuration || sourceVideo.duration) * 1000
                )
            );

        if(typeof ysFixWebmDuration === "function"){
            fixedBlob =
                await ysFixWebmDuration(
                    rawBlob,
                    durationMs,
                    {
                        logger: false
                    }
                );
        }
    }
    catch(error){
        console.warn(
            "WebM duration metadata fix failed:",
            error
        );

        // Keep the playable original if metadata repair fails.
        fixedBlob = rawBlob;
    }

    outputBlob = fixedBlob;

    const url =
        URL.createObjectURL(
            outputBlob
        );

    outputVideo.src = url;

    output.style.display =
        "block";

    downloadBtn.disabled =
        false;

    const displayDuration =
        Number(videoDuration || sourceVideo.duration);

    videoInfo.innerHTML =
        "📺 رزولوشن: "
        +
        canvas.width
        +
        " × "
        +
        canvas.height
        +
        "<br>"
        +
        "⏱ مدت: "
        +
        (
            Number.isFinite(displayDuration)
            ? displayDuration
            : 0
        ).toFixed(2)
        +
        " ثانیه"
        +
        "<br>"
        +
        "📦 حجم: "
        +
        formatBytes(
            outputBlob.size
        );

    finishCleanup();

    showToast(
        "گیف آماده شد!"
    );

}


/* =========================
   CLEANUP
========================= */

function finishCleanup(){


    processing=false;



    generateBtn.disabled =
    false;



    progressSection.style.display =
    "none";



    if(sourceVideo){

        sourceVideo.pause();

    }



}



/* =========================
   FILE SIZE FORMAT
========================= */

function formatBytes(bytes){


    if(bytes < 1024)

        return bytes+" B";



    if(bytes < 1024*1024)

        return (

            bytes/1024

        ).toFixed(1)+" KB";



    return (

        bytes/1024/1024

    ).toFixed(2)+" MB";


}

const themeBtn = document.getElementById("themeBtn");

const themes = ["", "cool", "gold"];
let currentTheme = 0;

const savedTheme = localStorage.getItem("theme");

if(savedTheme){
    currentTheme = Math.max(0, themes.indexOf(savedTheme));
}

applyTheme();

themeBtn.onclick = () => {

    currentTheme++;

    if(currentTheme >= themes.length){
        currentTheme = 0;
    }

    applyTheme();

};

function applyTheme(){

    const theme = themes[currentTheme];

    if(theme === ""){

        document.documentElement.removeAttribute("data-theme");
        themeBtn.textContent = "Theme";

    }else{

        document.documentElement.setAttribute("data-theme", theme);

        if(theme === "cool"){
            themeBtn.textContent = "Cool";
        }

        if(theme === "gold"){
            themeBtn.textContent = "Gold";
        }

    }

    localStorage.setItem("theme", theme);

    }
